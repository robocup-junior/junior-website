baseURL = "https://junior.robocup.org/"
locale = "en-US"
title = "RoboCupJunior"
enableRobotsTXT = true

[params]
  description = "RoboCupJunior: a project-oriented educational initiative that supports local, regional and international robotic events for young students."

# Keep WordPress URLs: pages and posts both live at /<slug>/,
# categories at /category/<slug>/.
[permalinks]
  [permalinks.page]
    posts = "/:slugorcontentbasename/"
  [permalinks.term]
    categories = "/category/:slug/"

[taxonomies]
  category = "categories"

[markup.goldmark.renderer]
  # Content imported from WordPress contains raw HTML.
  unsafe = true

