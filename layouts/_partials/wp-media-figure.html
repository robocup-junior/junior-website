{{- $info := index hugo.Data.wp_media .image | default dict -}}
{{- $style := .style | default $info.style -}}
<figure class="wp-block-media-text__media"><img loading="lazy" decoding="async"{{ with $info.width }} width="{{ . }}"{{ end }}{{ with $info.height }} height="{{ . }}"{{ end }} src="{{ .image }}" alt="{{ .alt }}"{{ with $info.class }} class="{{ . }}"{{ end }}{{ with $style }} style="{{ . | safeCSS }}"{{ end }}{{ with $info.srcset }} srcset="{{ . }}"{{ end }}{{ with $info.sizes }} sizes="{{ . }}"{{ end }}></figure>
