{{- /* Text beside a logo or photo shown at a fixed size in a light panel.
       image: path; alt: alt text ("" when it repeats the heading); side="right" puts the image right. */ -}}
<div class="about-split{{ if eq (.Get "side") "right" }} about-split--right{{ end }}"><div class="about-split__text">{{ partial "wp-render-markdown.html" (dict "page" .Page "text" .Inner) | safeHTML }}</div><figure class="about-split__media"><img src="{{ .Get "image" }}" alt="{{ .Get "alt" }}" loading="lazy" decoding="async"{{ with .Get "width" }} width="{{ . }}"{{ end }}{{ with .Get "height" }} height="{{ . }}"{{ end }}></figure></div>
