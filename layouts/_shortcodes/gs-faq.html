{{- /* One frequently asked question as a <details> disclosure
  (Getting Started section). "q" is the question; inner is the answer. */ -}}
<details class="gs-faq"><summary><h3 class="gs-faq-q">{{ .Get "q" }}</h3></summary><div class="gs-faq-a">{{ partial "wp-render-markdown.html" (dict "page" .Page "text" .Inner) | safeHTML }}</div></details>
