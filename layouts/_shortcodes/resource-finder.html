];
var LBL={}; LEAGUES.concat(TYPES,LEVELS,AUDS.slice(1)).forEach(function(p){LBL[p[0]]=p[1];});
var state={league:'all',type:'all',level:'all',audience:'all',q:''};
var KEYS={}; [['league',LEAGUES],['type',TYPES],['level',LEVELS],['audience',AUDS]].forEach(function(g){g[1].forEach(function(p){if(p[0]!=='all') KEYS[p[0]]=g[0];});});
var m=(location.hash||'').match(/^#rf-([a-z-]+)$/); if(m) m[1].split('-').forEach(function(k){if(KEYS[k]) state[KEYS[k]]=k;});
var shown=24;
function hash(){var p=['league','type','level','audience'].map(function(g){return state[g];}).filter(function(v){return v!=='all';}); try{history.replaceState(null,'',p.length?'#rf-'+p.join('-'):location.pathname+location.search);}catch(e){}}
function chips(group,list){
  var box=root.querySelector('[data-group="'+group+'"]');
  list.forEach(function(p){
    var b=document.createElement('button'); b.type='button'; b.className='rcjrf-chip'; b.textContent=p[1]; b.setAttribute('data-v',p[0]);
    b.addEventListener('click',function(){state[group]=p[0]; shown=24; sync(); hash(); render();});
    box.appendChild(b);
  });
}
function sync(){
  ['league','type','level','audience'].forEach(function(g){
    root.querySelectorAll('[data-group="'+g+'"] .rcjrf-chip').forEach(function(b){b.setAttribute('aria-pressed',String(b.getAttribute('data-v')===state[g]));});
  });
}
var ORDER={beginner:0,intermediate:1,advanced:2}, TORDER={rules:0,tutorial:1,code:2,field:3,video:4,community:5,teaching:6,research:7,werob:8};
function el(tag,cls,text){var e=document.createElement(tag); if(cls) e.className=cls; if(text) e.textContent=text; return e;}
function render(){
  var q=state.q.trim().toLowerCase();
  var list=R.filter(function(r){
    return (state.league==='all'||r.l.indexOf(state.league)>-1) && (state.type==='all'||r.ty===state.type) && (state.level==='all'||r.lv===state.level) && (state.audience==='all'||(r.au||[]).indexOf(state.audience)>-1) && (!q||(r.t+' '+r.d+' '+r.s+' '+(r.a||'')).toLowerCase().indexOf(q)>-1);
  }).sort(function(a,b){return (state.type==='werob'||state.type==='research')?(b.y-a.y||ORDER[a.lv]-ORDER[b.lv]):(ORDER[a.lv]-ORDER[b.lv]||TORDER[a.ty]-TORDER[b.ty]||(b.y||0)-(a.y||0));});
  var grid=root.querySelector('.rcjrf-grid'); grid.innerHTML='';
  root.querySelector('.rcjrf-count').textContent=list.length+(list.length===1?' resource':' resources')+(state.league==='all'?'':' for '+LBL[state.league]);
  var ll=root.querySelector('.rcjrf-league-link'); ll.innerHTML='';
  if(LEAGUE_PAGES[state.league]){var a=el('a',null,LEAGUE_PAGES[state.league][1]+' league page →'); if(state.league==='general') a.textContent='General Rules →'; a.href=siteURL(LEAGUE_PAGES[state.league][0]); ll.appendChild(a);}
  if(!list.length){
    var li=el('li','rcjrf-empty'); li.appendChild(document.createTextNode('No resources match these filters. '));
    var c=el('button','rcjrf-chip','Clear filters'); c.type='button'; c.addEventListener('click',function(){state={league:'all',type:'all',level:'all',audience:'all',q:''}; root.querySelector('#rcjrf-q').value=''; sync(); hash(); render();});
    li.appendChild(c); grid.appendChild(li); root.querySelector('.rcjrf-more').innerHTML=''; return;
  }
  list.slice(0,shown).forEach(function(r){
    var li=el('li','rcjrf-card');
    var h=el('p','rcjrf-card-title'); var a=el('a',null,r.t); a.href=siteURL(r.u); if(/^https?:/.test(r.u)&&r.u.indexOf(location.host)<0){a.rel='noopener';} h.appendChild(a); li.appendChild(h);
    if(r.a) li.appendChild(el('p','rcjrf-by',r.a));
    li.appendChild(el('p','rcjrf-card-desc',r.d));
    if(r.x){var xp=el('p','rcjrf-extra'); r.x.forEach(function(x,i){if(i) xp.appendChild(document.createTextNode(' · ')); var xa=el('a',null,x[0]); xa.href=siteURL(x[1]); xa.rel='noopener'; xp.appendChild(xa);}); li.appendChild(xp);}
    li.appendChild(el('p','rcjrf-src','From '+r.s));
    var tags=el('div','rcjrf-tags');
    var lg=r.l.map(function(x){return LBL[x];}).join(', ');
    [lg,LBL[r.ty],LBL[r.lv]].forEach(function(t){tags.appendChild(el('span','rcjrf-tag',t));});
    li.appendChild(tags); grid.appendChild(li);
  });
  var more=root.querySelector('.rcjrf-more'); more.innerHTML='';
  if(list.length>shown){var mb=el('button','rcjrf-chip','Show '+Math.min(48,list.length-shown)+' more ('+(list.length-shown)+' hidden)'); mb.type='button'; mb.addEventListener('click',function(){shown+=48; render();}); more.appendChild(mb);}
}
chips('league',LEAGUES); chips('type',TYPES); chips('level',LEVELS); chips('audience',AUDS); sync();
// The list above is a fallback copy. The live list comes from github.com/robocup-junior/rcj-resources.
var DATA='https://robocup-junior.github.io/rcj-resources/resources.json';
function counts(){document.querySelectorAll('a.rcjrf-year').forEach(function(a){var y=+a.getAttribute('data-year'),n=R.filter(function(r){return r.ty==='werob'&&r.y===y;}).length; a.textContent=n+' in the library';});}
document.addEventListener('DOMContentLoaded',counts);
if(window.fetch) fetch(DATA,{cache:'no-cache'}).then(function(res){if(!res.ok) throw new Error(res.status); return res.json();}).then(function(j){
  var list=(j&&j.resources||[]).map(function(x){return {t:x.title,u:String(x.url).replace(/^https:\/\/junior\.robocup\.org(?=\/)/,''),d:x.description,l:x.leagues||[],ty:x.type,lv:x.level,s:x.source,a:x.authors,y:x.year,au:x.audience,x:x.links&&x.links.map(function(k){return [k.label,k.url];})};})
    .filter(function(r){return r.t&&r.u&&LBL[r.ty]&&LBL[r.lv]&&r.l.length&&r.l.every(function(l){return LBL[l];});});
  if(list.length){R=list; render(); counts();}
}).catch(function(){});
var t; root.querySelector('#rcjrf-q').addEventListener('input',function(e){clearTimeout(t); var v=e.target.value; t=setTimeout(function(){state.q=v; shown=24; render();},150);});
render();
})();
</script>
