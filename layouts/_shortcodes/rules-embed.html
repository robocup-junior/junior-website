{{- /* Embedded document with a visible "open in a new tab" alternative.
       Params: src, title (iframe title, required for accessibility),
       label (bar text), open (link text). */ -}}
{{- $src := .Get "src" -}}
<figure class="rules-embed"><figcaption class="rules-embed__bar"><span class="rules-embed__label">{{ .Get "label" | default "Embedded document" }}</span><a class="rules-embed__open" href="{{ $src }}" target="_blank" rel="noopener noreferrer">{{ .Get "open" | default "Open in a new tab" }}<svg aria-hidden="true" focusable="false" width="14" height="14" viewBox="0 0 24 24"><path fill="currentColor" d="M14 3h7v7h-2V6.41l-9.29 9.3-1.42-1.42L17.59 5H14V3zM5 5h6v2H7v10h10v-4h2v6H5V5z"/></svg></a></figcaption><div class="rules-embed__frame"><iframe loading="lazy" title="{{ .Get "title" | default "Embedded document" }}" src="{{ $src }}"></iframe></div></figure>
