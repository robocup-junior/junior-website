{{- /* Reserved titles preserve attributes on imported links. */ -}}
<a href="{{ .Destination | safeURL }}"{{ if in (slice "newtab" "newtab-break") .Title }} target="_blank" rel="noreferrer noopener"{{ else if strings.HasPrefix .Title "resource-year-" }} class="rcjrf-year" data-year="{{ strings.TrimPrefix "resource-year-" .Title }}"{{ else if eq .Title "newtab-opener-first" }} target="_blank" rel="noopener noreferrer"{{ else if eq .Title "newtab-opener-first-styled" }} style="font-size: revert; text-indent: 0em;" target="_blank" rel="noopener noreferrer"{{ else if in (slice "newtab-noopener" "newtab-noopener-break" "newtab-noopener-indent" "newtab-noopener-indent-break") .Title }}{{ if in (slice "newtab-noopener-indent" "newtab-noopener-indent-break") .Title }} style="text-indent: 0em;"{{ end }} target="_blank" rel="noopener"{{ else if ne .Title "break" }}{{ with .Title }} title="{{ . }}"{{ end }}{{ end }}>{{ .Text }}{{ if in (slice "break" "newtab-break" "newtab-noopener-break" "newtab-noopener-indent-break") .Title }}<br>{{ end }}</a>
