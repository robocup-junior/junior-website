{{ define "main" }}
{{- /* Category archives (/category/…/). The page title (h1) is the banner in
     header.html. Styles: assets/css/posts.css. */ -}}
<div id="content" class="cryout rcjp"><div id="container" class="one-column">
  <main id="main" class="main rcjp-archive">
    <ul class="rcjp-cards rcjp-cards-archive">
      {{ range .Paginator.Pages }}{{ partial "summary.html" . }}{{ end }}
    </ul>
    {{ partial "pagination.html" . }}
  </main>
</div>{{ partial "colophon.html" . }}</div>
{{ end }}
